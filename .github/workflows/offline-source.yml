name: Offline source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Standard-library tests (no package downloads or firmware)
        run: python -m unittest discover -s tests -v
      - name: Existing synthetic codec tests
        env:
          PYTHON: python
        run: node --test codec/test_builder.mjs
      - name: C source dependency closure
        run: python -m leica_source compile-sources --build-dir build/objects
      - name: Development source artifact
        run: |
          python -m leica_source default-config --output ci-selection.json
          python -m leica_source build-source --config ci-selection.json --output development-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: development-source-not-firmware
          path: development-source.zip
